services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentahouse-backend
    ports:
      - "3001:3001"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGO_URI=mongodb://host.docker.internal:27017/rentahouse01
      - CLIENT_URL=http://localhost:3000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    container_name: rentahouse-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped